<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ config.title | default(value="Blog") }}{% endblock title %}</title>
    <link rel="icon" href="{{ get_url(path='favicon.ico') }}" type="image/x-icon" />
    <link rel="stylesheet" href="{{ get_url(path='main.css') }}" />
    {% block head %}{% endblock head %}
</head>
    
<body>
    <nav class="site-nav" aria-label="Primary">
        <ul class="site-nav-back">
            {% block nav_back %}{% endblock nav_back %}
        </ul>
        <ul class="site-nav-explore">
            {% block nav_explore %}{% endblock nav_explore %}
        </ul>
    </nav>
    <main class="site-main">
        {% block content %}{% endblock content %}
    </main>
</body>

</html>
